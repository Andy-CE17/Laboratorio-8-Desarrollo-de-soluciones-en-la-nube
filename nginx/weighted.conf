upstream tecnostock {
    server backend1:8000 weight=5 max_fails=2 fail_timeout=15s;
    server backend2:8000 weight=3 max_fails=2 fail_timeout=15s;
    server backend3:8000 weight=2 max_fails=2 fail_timeout=15s;
}
server {
    listen 80 default_server;
    server_name _;
    location / {
        proxy_pass http://tecnostock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        add_header X-Served-By $upstream_addr always;
    }
}
