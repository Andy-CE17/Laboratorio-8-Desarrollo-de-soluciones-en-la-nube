services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/tecnostock.sqlite3
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8001,http://localhost:8001
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - lab8_data:/data
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py seed_demo && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -

volumes:
  lab8_data:
